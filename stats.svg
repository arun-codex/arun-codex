<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
<defs>
  <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e040fb"/>
    <stop offset="100%" stop-color="#7c4dff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="420" height="220" rx="16" fill="#0d0117" stroke="#e040fb" stroke-width="1.5" stroke-opacity="0.4"/>
<text x="18" y="30" fill="#e040fb" font-family="monospace" font-size="13" font-weight="bold">📊 GitHub Stats</text>
<!-- Rank ring -->
<circle cx="60" cy="115" r="44" fill="none" stroke="#1a0030" stroke-width="8"/>
<circle cx="60" cy="115" r="44" fill="none" stroke="url(#sg)" stroke-width="8" stroke-linecap="round"
  stroke-dasharray="276.46" stroke-dashoffset="276.46" transform="rotate(-90 60 115)">
  <animate attributeName="stroke-dashoffset" from="276.46" to="69.1" dur="1.8s" fill="freeze" begin="0.3s"/>
</circle>
<text x="60" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">B+</text>
<text x="60" y="126" text-anchor="middle" fill="#b388ff" font-family="monospace" font-size="10">RANK</text>
<!-- Stat rows -->
<g font-family="monospace" font-size="12" fill="#cccccc">
  <g opacity="0"><text x="120" y="65">⭐ Total Stars</text><text x="360" y="65" text-anchor="end" fill="#ffd700">12</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="90">💻 Total Commits (2026)</text><text x="360" y="90" text-anchor="end" fill="#69ff47">143</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.65s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="115">🔀 Total PRs</text><text x="360" y="115" text-anchor="end" fill="#40c4ff">8</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="140">🐛 Total Issues</text><text x="360" y="140" text-anchor="end" fill="#ff6e40">5</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.15s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="165">🏢 Contributed To</text><text x="360" y="165" text-anchor="end" fill="#e040fb">4</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="190">📁 Public Repos</text><text x="360" y="190" text-anchor="end" fill="#b388ff">17</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.65s" fill="freeze"/></g>
</g>
<!-- Divider lines -->
<line x1="110" y1="48" x2="110" y2="205" stroke="#2a0050" stroke-width="1"/>
</svg>