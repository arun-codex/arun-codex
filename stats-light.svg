<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
<defs>
  <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="420" height="220" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4"/>
<text x="18" y="30" fill="#7C3AED" font-family="monospace" font-size="13" font-weight="bold">📊 GitHub Stats</text>
<!-- Rank ring -->
<circle cx="60" cy="115" r="44" fill="none" stroke="#E2E8F0" stroke-width="8"/>
<circle cx="60" cy="115" r="44" fill="none" stroke="url(#sg)" stroke-width="8" stroke-linecap="round"
  stroke-dasharray="276.46" stroke-dashoffset="276.46" transform="rotate(-90 60 115)">
  <animate attributeName="stroke-dashoffset" from="276.46" to="69.1" dur="1.8s" fill="freeze" begin="0.3s"/>
</circle>
<text x="60" y="110" text-anchor="middle" fill="#1F2937" font-family="monospace" font-size="18" font-weight="bold">B+</text>
<text x="60" y="126" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="10">RANK</text>
<!-- Stat rows -->
<g font-family="monospace" font-size="12" fill="#475569">
  <g opacity="0"><text x="120" y="65">⭐ Total Stars</text><text x="360" y="65" text-anchor="end" fill="#F59E0B">12</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="90">💻 Total Commits (2026)</text><text x="360" y="90" text-anchor="end" fill="#06B6D4">143</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.65s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="115">🔀 Total PRs</text><text x="360" y="115" text-anchor="end" fill="#06B6D4">8</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="140">🐛 Total Issues</text><text x="360" y="140" text-anchor="end" fill="#F97316">5</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.15s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="165">🏢 Contributed To</text><text x="360" y="165" text-anchor="end" fill="#7C3AED">4</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/></g>
  <g opacity="0"><text x="120" y="190">📁 Public Repos</text><text x="360" y="190" text-anchor="end" fill="#06B6D4">17</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.65s" fill="freeze"/></g>
</g>
<!-- Divider lines -->
<line x1="110" y1="48" x2="110" y2="205" stroke="#1E293B" stroke-width="1"/>
</svg>