<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
<defs>
  <linearGradient id="py" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3776ab"/><stop offset="100%" stop-color="#ffd343"/></linearGradient>
  <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4eaa25"/><stop offset="100%" stop-color="#89e051"/></linearGradient>
  <linearGradient id="cc" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00599c"/><stop offset="100%" stop-color="#004c8b"/></linearGradient>
  <linearGradient id="js" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f7df1e"/><stop offset="100%" stop-color="#e5c900"/></linearGradient>
</defs>
<rect width="420" height="200" rx="16" fill="#0d0117" stroke="#7c4dff" stroke-width="1.5" stroke-opacity="0.4"/>
<text x="18" y="30" fill="#e040fb" font-family="monospace" font-size="13" font-weight="bold">🌐 Top Languages</text>
<g font-family="monospace" font-size="12">
  <!-- Python 55% -->
  <text x="18" y="65" fill="#ffd343">Python</text>
  <rect x="18" y="72" height="14" width="0" rx="7" fill="url(#py)">
    <animate attributeName="width" from="0" to="214" dur="1s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="240" y="83" fill="#aaa" font-size="11" opacity="0">55%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.3s" fill="freeze"/></text>
  <!-- Bash 20% -->
  <text x="18" y="112" fill="#89e051">Bash</text>
  <rect x="18" y="119" height="14" width="0" rx="7" fill="url(#sh)">
    <animate attributeName="width" from="0" to="78" dur="1s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="105" y="130" fill="#aaa" font-size="11" opacity="0">20%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/></text>
  <!-- C 15% -->
  <text x="18" y="158" fill="#6195c8">C</text>
  <rect x="18" y="165" height="14" width="0" rx="7" fill="url(#cc)">
    <animate attributeName="width" from="0" to="59" dur="1s" begin="0.9s" fill="freeze"/>
  </rect>
  <text x="86" y="176" fill="#aaa" font-size="11" opacity="0">15%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s" fill="freeze"/></text>
  <!-- JavaScript 10% -->
  <text x="220" y="112" fill="#f7df1e">JavaScript</text>
  <rect x="220" y="119" height="14" width="0" rx="7" fill="url(#js)">
    <animate attributeName="width" from="0" to="39" dur="1s" begin="1.2s" fill="freeze"/>
  </rect>
  <text x="268" y="130" fill="#aaa" font-size="11" opacity="0">10%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/></text>
</g>
</svg>